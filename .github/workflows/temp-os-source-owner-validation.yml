name: Temporary OS Source Owner Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-os-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate JavaScript syntax
        run: node --check os-validation/operations_business_ui.js
      - name: Validate Python syntax
        run: python -m py_compile os-validation/miniprogram_bridge.py
      - name: Validate source-owner UI contract
        shell: bash
        run: |
          set -euo pipefail
          grep -F '人员归属统计' os-validation/operations_business_ui.js
          grep -F '归属手机号' os-validation/operations_business_ui.js
          grep -F 'ownerName' os-validation/operations_business_ui.js
          grep -F 'ownerPhone' os-validation/operations_business_ui.js
          grep -F 'autocomplete="off"' os-validation/operations_business_ui.js
          grep -F 'ownerStats' os-validation/miniprogram_bridge.py
