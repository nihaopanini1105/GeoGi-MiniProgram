name: Temporary Production Release Probe
# channel-navigation-hotfix verification

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  production-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe MiniProgram API health
        shell: bash
        run: |
          set -euo pipefail
          echo "=== api health ==="
          curl --fail --silent --show-error --location https://api.geogi.cn/health | tee /tmp/api-health.json
          node -e 'const p=require("/tmp/api-health.json"); if(!p.ok) process.exit(2); console.log(JSON.stringify(p,null,2))'

      - name: Detect no-code MiniProgram server contract
        shell: bash
        run: |
          set -euo pipefail
          echo "=== attribution direct ==="
          curl --fail --silent --show-error --location 'https://api.geogi.cn/api/attribution/resolve?token=' | tee /tmp/attr.json
          node -e 'const p=require("/tmp/attr.json"); if(!p.ok) process.exit(2); console.log(JSON.stringify(p,null,2))'
          echo "=== removed redeem endpoint ==="
          status="$(curl --silent --show-error --output /tmp/redeem.json --write-out '%{http_code}' -X POST -H 'Content-Type: application/json' --data '{"code":"PROBE"}' https://api.geogi.cn/api/redeem-codes/quote || true)"
          echo "redeem_endpoint_status=$status"
          cat /tmp/redeem.json || true
          echo "expected_new_contract_status=404"

      - name: Probe Operations Admin
        shell: bash
        run: |
          set -euo pipefail
          echo "=== ops health ==="
          curl --fail --silent --show-error --location https://ops.geogi.cn/healthz | tee /tmp/ops-health.json
          echo
          echo "=== ops ready ==="
          curl --fail --silent --show-error --location https://ops.geogi.cn/readyz | tee /tmp/ops-ready.json
          echo
          echo "=== operator UI source-attribution marker ==="
          curl --fail --silent --show-error --location https://ops.geogi.cn/static/operations_business_ui.js -o /tmp/business-ui.js
          if grep -F '客户无需输入任何渠道码' /tmp/business-ui.js; then echo "new_channel_ui_marker=present"; else echo "new_channel_ui_marker=absent"; fi
          if grep -F '绑定渠道后自动应用该渠道客户权益' /tmp/business-ui.js; then echo "new_source_binding_marker=present"; else echo "new_source_binding_marker=absent"; fi
          if grep -F '合作渠道与兑换码' /tmp/business-ui.js; then echo "old_redeem_ui_marker=present"; else echo "old_redeem_ui_marker=absent"; fi

      - name: Verify channel navigation hotfix
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://ops.geogi.cn/static/pipeline_ui_v1_3_3.js -o /tmp/pipeline.js
          curl --fail --silent --show-error --location https://ops.geogi.cn/static/navigation_bootstrap_fix.js -o /tmp/nav.js
          grep -F "'channel-overview'" /tmp/pipeline.js
          grep -F "'channel-manage'" /tmp/pipeline.js
          grep -F "'channel-statistics'" /tmp/pipeline.js
          grep -F "button.dataset.subview" /tmp/nav.js
          echo "channel_navigation_hotfix=PASS"

      - name: Probe official source codes
        shell: bash
        run: |
          set -euo pipefail
          for name in official-website official-account business-card-liaohuafeng business-card-lishasha; do
            status="$(curl --silent --show-error --location --output "/tmp/$name.png" --write-out '%{http_code}' "https://api.geogi.cn/api/source-codes/$name.png")"
            echo "$name=$status bytes=$(wc -c < "/tmp/$name.png")"
            test "$status" = "200"
          done
