name: One-time GeoGi referral-code image export (preserve original)
on:
  push:
    branches:
      - ops/qr-card-export-20261024
permissions:
  contents: read
jobs:
  fetch-official-codes:
    runs-on: ubuntu-latest
    steps:
      - name: Read-only fetch of both official mini-program-code JPEG binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p codes
          for who in liaohuafeng lishasha; do
            url="https://api.geogi.cn/api/source-codes/business-card-${who}.png"
            curl --http1.1 -fSL --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 15 --max-time 60 \
              "${url}" -o "codes/business-card-${who}.jpg"
          done
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,base64
          for who in ('liaohuafeng','lishasha'):
              b=Path('codes/business-card-'+who+'.jpg').read_bytes()
              if not b.startswith(b'\xff\xd8\xff') or not b.endswith(b'\xff\xd9') or not (2000<len(b)<500000):
                  raise SystemExit('INVALID_WECHAT_CODE_IMAGE:'+who)
              print('QR_JPEG_VALID='+who+' bytes='+str(len(b))+' sha256='+hashlib.sha256(b).hexdigest())
              print('QR_BASE64_START:'+who)
              for i in range(0,len(b),192): print(base64.b64encode(b[i:i+192]).decode())
              print('QR_BASE64_END:'+who)
          PY
      - name: Export original QR images as a private Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: geogi-two-official-source-codes-raw-jpeg-20261024
          path: codes/*.jpg
          retention-days: 1
          if-no-files-found: error
