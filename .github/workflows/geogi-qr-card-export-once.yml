name: One-time GeoGi referral-code verification
on:
  push:
    branches:
      - ops/qr-card-export-20261024
permissions:
  contents: read
jobs:
  diagnose-official-public-code-routing:
    runs-on: ubuntu-latest
    steps:
      - name: Read-only inspect both documented and static code delivery paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cards
          for who in liaohuafeng lishasha; do
            valid=0
            for route in api/source-codes source-codes; do
              url="https://api.geogi.cn/${route}/business-card-${who}.png"
              echo "REQUEST_PATH=${route}/business-card-${who}.png"
              curl --http1.1 --silent --show-error -L --retry 2 --connect-timeout 15 --max-time 35 \
                -D headers.txt -o response.bin -w 'RESPONSE_STATUS=%{http_code} RESPONSE_TYPE=%{content_type} REMOTE_IP=%{remote_ip} END_URL=%{url_effective}\n' "${url}" || true
              echo "FILETYPE=$(file -b response.bin)"
              echo "FILESIZE=$(wc -c <response.bin)"
              echo 'HEADERS:'; head -n 12 headers.txt
              echo 'RESPONSE_START:'; head -c 220 response.bin | strings | head -n 5
              if python3 - <<'PY'
          from pathlib import Path
          import struct
          b=Path('response.bin').read_bytes()
          assert b.startswith(b'\x89PNG\r\n\x1a\n'), 'not PNG'
          w,h=struct.unpack('>II',b[16:24])
          assert w==h and w>=200 and len(b)>=2000
          print('VALID_PNG='+str(w)+'x'+str(h))
          PY
              then
                cp response.bin "cards/business-card-${who}.png"
                valid=1;break
              fi
            done
            if [ "$valid" -eq 0 ]; then echo "NO_REAL_PNG=${who}"; exit 1; fi
          done
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,base64
          for who in ('liaohuafeng','lishasha'):
              b=Path('cards/business-card-'+who+'.png').read_bytes()
              print('QR_VALID='+who+' bytes='+str(len(b))+' sha256='+hashlib.sha256(b).hexdigest())
              print('QR_B64_START:'+who)
              for i in range(0,len(b),192): print(base64.b64encode(b[i:i+192]).decode('ascii'))
              print('QR_B64_END:'+who)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: geogi-referral-source-codes-original-20261024
          path: cards/*.png
          retention-days: 1
