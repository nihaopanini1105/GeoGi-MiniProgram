name: V1 OS Delivery Boundary

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/v1-os-delivery-boundary.yml"
      - "server/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  miniprogram-boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Syntax check production boundary
        run: |
          node --check server/src/services/delivery-package-store.js
          node --check server/src/services/os-intake.js
          node --check server/src/services/os-operations-bridge.js
          node --check server/src/services/customer-portal.js
          node --check server/src/server.js
          bash -n server/scripts/deploy-production-from-mac.sh
          bash -n server/scripts/deploy-production-release.sh
          bash -n server/scripts/activate-production-os-bridge.sh

      - name: Payment store regression
        run: cd server && node tests/payment_store_regression.js

      - name: WeChat Pay regression
        run: cd server && node tests/wechat_pay_security_regression.js

      - name: Paid diagnostic copy regression
        run: cd server && node tests/paid_diagnostic_copy_contract_regression.js

      - name: Source attribution and commission regression
        run: |
          cd server
          node tests/channel_redemption_commission_regression.js
          node tests/channel_store_concurrency_regression.js

      - name: Customer portal regressions
        run: |
          cd server
          node tests/delivery_package_boundary_regression.js
          node tests/customer_portal_status_regression.js
          node tests/customer_session_regression.js
          node tests/customer_supplement_regression.js
          node tests/customer_experience_details_regression.js

      - name: OS bridge notification and production regressions
        run: |
          cd server
          node tests/os_operations_bridge_regression.js
          node tests/configure_os_bridge_production_regression.js
          node tests/os_artifact_ingress_regression.js
          node tests/feishu_transient_retry_regression.js
          node tests/feishu_ops_notifications_regression.js
          node tests/feishu_notification_preflight_regression.js
          node tests/production_env_loader_regression.js
