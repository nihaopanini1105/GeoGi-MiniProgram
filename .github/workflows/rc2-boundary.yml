name: GeoGi RC2 MiniProgram Boundary

on:
  pull_request:
    branches:
      - release/v1.0.0-rc.2
  push:
    branches:
      - release/v1.0.0-rc.2

jobs:
  authority-boundary:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run check:authority
      - name: Ensure removed intelligence/report code stays absent
        run: |
          test ! -f src/services/diagnosis-engine.js
          test ! -f src/services/workflow-command.js
          test ! -f src/services/report-pdf.js
          test ! -f src/services/report-release-gate.js
          test ! -f src/services/ai-share-extractor.js
          test ! -f src/scripts/render-report-pdf.py
          test ! -f src/scripts/report-release.js
      - name: Verify customer delivery contract
        run: |
          test -f src/services/delivery-package-store.js
          test -f src/scripts/import-os-delivery-package.js
          grep -q 'delivery_package' src/services/delivery-package-store.js
          grep -q '1.0.0-rc.2' package.json
